<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home</title>
  <link rel="stylesheet" href="../componets/layout-styles.css">
  <style>
    .home-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }

      <div class="logo"><img src="logo.png" alt="High Control Point"></div>

  <script src="app.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => HCP.init());</script>

</html>
