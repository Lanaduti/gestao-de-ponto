<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contracheque - High Control Point</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../componets/layout-styles.css">
  <style>
      body { font-family: "Times New Roman", Times, serif; background-color: #ffffff; color: #333; }
      .pink-accent { color: #A4133C; }
      .bg-pink-card { background-color: #FFB6C1; } 
      .bg-pink-input { background-color: #FF9AA2; } 
      .card-shadow { box-shadow: 0 4px 25px rgba(0,0,0,0.06); border: 1px solid #f0f0f0; }
      .font-serif-italic { font-family: "Times New Roman", Times, serif; font-style: italic; }
  </style>
</head>
<body>
    <main class="content p-2 md:p-10 flex justify-center items-start mt-16">
        <div class="w-full max-w-4xl bg-white rounded-[40px] card-shadow p-6 md:p-12">

            <div class="flex justify-center mb-10">
                <img src="logo.png" alt="High Control Point" class="h-20 w-auto object-contain">
            </div>

            <h2 class="pink-accent text-sm font-semibold mb-10 uppercase tracking-wider text-center md:text-left">
                Seu Contracheque:
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div class="bg-pink-card p-4 rounded-2xl">
                    <p class="text-gray-800 text-xs font-bold mb-2 uppercase tracking-tighter">Funcionário (A):</p>
                    <div id="contracheque-nome-funcionario" class="bg-pink-input rounded-full px-4 py-1 text-gray-900 text-sm font-medium">
                        Carregando...
                    </div>
                </div>
                <div class="bg-pink-card p-4 rounded-2xl">
                    <p class="text-gray-800 text-xs font-bold mb-2 uppercase tracking-tighter">Cargo:</p>
                    <div id="contracheque-cargo-funcionario" class="bg-pink-input rounded-full px-4 py-1 text-gray-900 text-sm font-medium">
                        ...
                    </div>
                </div>
            </div>


            <div class="bg-pink-card p-3 rounded-2xl mb-4 flex items-center gap-3">
                <div class="flex-shrink-0">
                    <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-sm">
                        <img src="map_854952.png" alt="Mapa" class="h-7 w-auto object-contain">
                    </div>
                </div>
                <div class="bg-pink-input rounded-xl px-3 py-2 flex-grow min-w-0">
                    <p id="contracheque-location" class="text-[10px] md:text-xs text-gray-900 leading-tight italic font-medium">
                        📍 Buscando localização...
                    </p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2 ml-1">Referência (Mês):</label>
                    <select id="relatorio-mes" class="w-full bg-pink-input rounded-xl py-3 px-4 text-gray-800 font-bold focus:outline-none cursor-pointer">
                        <option value="1">Janeiro</option>
                        <option value="2">Fevereiro</option>
                        <option value="3">Março</option>
                        <option value="4">Abril</option>
                        <option value="5">Maio</option>
                        <option value="6">Junho</option>
                        <option value="7">Julho</option>
                        <option value="8">Agosto</option>
                        <option value="9">Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11">Novembro</option>
                        <option value="12">Dezembro</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2 ml-1">Referência (Ano):</label>
                    <select id="relatorio-ano" class="w-full bg-pink-input rounded-xl py-3 px-4 text-gray-800 font-bold focus:outline-none cursor-pointer">
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <div class="bg-pink-card p-4 rounded-2xl flex flex-col items-center">
                    <span class="text-[10px] font-bold text-gray-800 uppercase mb-2">Salário Bruto</span>
                    <div id="contracheque-bruto" class="bg-pink-input rounded-xl px-4 py-2 font-bold text-gray-800 text-sm w-full text-center shadow-inner">R$ 0,00</div>
                </div>
                <div class="bg-pink-card p-4 rounded-2xl flex flex-col items-center">
                    <span class="text-[10px] font-bold text-gray-800 uppercase mb-2">Total Descontos</span>
                    <div id="contracheque-descontos" class="bg-pink-input rounded-xl px-4 py-2 font-bold text-red-600 text-sm w-full text-center shadow-inner">R$ 0,00</div>
                </div>
                <div class="bg-pink-card p-4 rounded-2xl flex flex-col items-center border-2 border-pink-400">
                    <span class="text-[10px] font-bold text-gray-800 uppercase mb-2">Líquido a receber</span>
                    <div id="contracheque-liquido" class="bg-pink-input rounded-xl px-4 py-2 font-bold text-pink-900 text-sm w-full text-center shadow-inner">R$ 0,00</div>
                </div>
            </div>

            <div class="mb-10">
                <h3 class="text-pink-900 font-bold text-xs uppercase mb-4 tracking-widest text-center">Detalhamento de Descontos</h3>
                <div id="contracheque-lista-descontos" class="bg-pink-card/20 rounded-2xl p-6 border border-pink-100 min-h-[150px]">
                    <!-- Injetado dinamicamente -->
                    <p class="text-center text-gray-400 py-10 italic text-sm">Carregando detalhes...</p>
                </div>
            </div>

            <div class="flex justify-end gap-6 px-2 no-print">
                <button onclick="HCP.baixarContrachequePDF()" class="pink-accent hover:opacity-70 transition-opacity" title="Baixar PDF">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => HCP.init());</script>
</body>
</html>
