<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Relatórios Gerais - High Control Point</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../componets/layout-styles.css">
  <style>
    .pink-accent { color: #A4133C; }
    .bg-pink-light { background-color: #FFC1CC; }
    .table-row-border { border-bottom: 1px solid #ffffff; }
    .card-shadow { box-shadow: 0 4px 25px rgba(0,0,0,0.06); border: 1px solid #f0f0f0; }
  </style>
</head>
<body>
    <main class="content p-2 md:p-10 flex justify-center items-start mt-16">
        <div class="w-full max-w-6xl bg-white rounded-[40px] card-shadow p-6 md:p-10">
            <div class="flex justify-center mb-10">
                <img src="logo.png" alt="High Control Point" class="h-20 w-auto object-contain">
            </div>
            <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
                <h2 class="pink-accent text-lg font-bold uppercase tracking-widest text-center md:text-left">Relatórios Gerais de Ponto</h2>
                <div class="flex gap-3">
                    <button onclick="HCP.baixarRelatorioGeralPDF('mensal')" class="bg-pink-light pink-accent px-4 py-2 rounded-full font-bold text-xs hover:opacity-80 transition-opacity flex items-center gap-2">
                        <i class="fas fa-file-pdf"></i> PDF Mensal
                    </button>
                    <button onclick="HCP.baixarRelatorioGeralPDF('diario')" class="bg-[#A4133C] text-white px-4 py-2 rounded-full font-bold text-xs hover:opacity-90 transition-opacity flex items-center gap-2 shadow-md">
                        <i class="fas fa-file-pdf"></i> PDF Diário
                    </button>
                </div>
            </div>

            <!-- Filtros de Busca -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2 ml-1 text-sm">Dia:</label>
                    <input type="number" id="relatorio-admin-dia" min="1" max="31" onchange="HCP.carregarRelatoriosAdmin()" placeholder="Todos" class="w-full bg-pink-light rounded-xl py-3 px-4 text-gray-800 focus:ring-2 focus:ring-pink-400 outline-none">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2 ml-1 text-sm">Mês:</label>
                    <select id="relatorio-admin-mes" onchange="HCP.carregarRelatoriosAdmin()" class="w-full bg-pink-light rounded-xl py-3 px-4 text-gray-800 focus:ring-2 focus:ring-pink-400 outline-none">
                        <option value="">Todos os meses</option>
                        <option value="1">Janeiro</option>
                        <option value="2">Fevereiro</option>
                        <option value="3">Março</option>
                        <option value="4">Abril</option>
                        <option value="5">Maio</option>
                        <option value="6">Junho</option>
                        <option value="7">Julho</option>
                        <option value="8">Agosto</option>
                        <option value="9">Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11">Novembro</option>
                        <option value="12">Dezembro</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2 ml-1 text-sm">Ano:</label>
                    <select id="relatorio-admin-ano" onchange="HCP.carregarRelatoriosAdmin()" class="w-full bg-pink-light rounded-xl py-3 px-4 text-gray-800 focus:ring-2 focus:ring-pink-400 outline-none">
                        <option value="">Todos os anos</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                </div>
            </div>

            <div class="overflow-x-auto bg-pink-light rounded-3xl overflow-hidden shadow-sm">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-pink-800 font-bold border-b border-white uppercase text-xs">
                            <th class="px-6 py-4 border-r border-white tracking-wider">Funcionário</th>
                            <th class="px-6 py-4 border-r border-white tracking-wider">Data</th>
                            <th class="px-6 py-4 border-r border-white tracking-wider">Entrada</th>
                            <th class="px-6 py-4 border-r border-white tracking-wider">Almoco S.</th>
                            <th class="px-6 py-4 border-r border-white tracking-wider">Almoco V.</th>
                            <th class="px-6 py-4 tracking-wider">Saída</th>
                        </tr>
                    </thead>
                    <tbody id="relatorio-admin-table-body" class="text-pink-900 font-medium">
                        <tr>
                            <td colspan="6" class="px-6 py-10 text-center italic">Carregando registros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => HCP.init());
    </script>
</body>
</html>
