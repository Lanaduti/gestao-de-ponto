<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - High Control Point</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Times New Roman", Times, serif; background-color: #ffffff; }
        .pink-primary { background-color: #A4133C; }
        .pink-light { background-color: #FFB6C1; }
        .input-gray { background-color: #E5E7EB; }
        .card-shadow { box-shadow: 0 4px 25px rgba(0,0,0,0.06); border: 1px solid #f0f0f0; }
    </style>
</head>
<body class="p-2 md:p-8 flex justify-center items-center min-h-screen">

    <div class="w-full max-w-md bg-white rounded-[30px] md:rounded-[40px] card-shadow p-6 md:p-12 flex flex-col items-center">
        
        <div class="mb-8 md:mb-10">
            <img src="logo.png" alt="High Control Point" class="h-16 md:h-20 w-auto object-contain">
        </div>

        <h2 class="text-pink-600 text-xl font-bold mb-8">Login</h2>

        <form class="w-full space-y-4" id="loginForm">
            <div>
                <input type="email" id="email" placeholder="Email" required
                    class="w-full input-gray rounded-full py-3 px-6 text-gray-700 placeholder-gray-500 outline-none focus:ring-2 focus:ring-pink-300 transition-all">
            </div>

            <div class="pb-4">
                <input type="password" id="password" placeholder="Senha" required
                    class="w-full input-gray rounded-full py-3 px-6 text-gray-700 placeholder-gray-500 outline-none focus:ring-2 focus:ring-pink-300 transition-all">
            </div>

            <button type="submit" 
                class="w-full pink-primary text-white font-bold py-3 rounded-2xl hover:opacity-90 transition-opacity shadow-md">
                Entrar
            </button>
        </form>

        <div class="mt-6">
            <a href="reset_password.html" class="text-pink-600 text-sm hover:underline">Esqueci minha senha</a>
        </div>

    </div>

    <!-- Importação do Administrador Central -->
    <script src="app.js"></script>
    <script>
        // Conecta o formulário à lógica centralizada
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const emailVal = document.getElementById('email').value;
            const passVal = document.getElementById('password').value;
            HCP.login(emailVal, passVal);
        });
    </script>

</body>
</html>
