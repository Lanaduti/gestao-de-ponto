<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - High Control Point</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../componets/layout-styles.css">
  <style>
    .dashboard-content { padding: 20px; width: 100%; max-width: 1200px; margin: 0 auto; }
    /* Estilos específicos da página */
    .pink-accent { color: #A4133C; }
    .bg-pink-card { background-color: #FFB6C1; } 
    .bg-pink-input { background-color: #FF9AA2; } 
    .bg-pink-button { background-color: #FF829D; }
    .card-shadow { box-shadow: 0 4px 25px rgba(0,0,0,0.06); border: 1px solid #f0f0f0; }
    .bar-grow { transition: height 1s ease-in-out; }
  </style>
</head>
<body>
    <main class="content">
        <div class="dashboard-content">
            <div class="w-full bg-white rounded-[40px] card-shadow p-6 md:p-12">
                <div class="flex justify-center mb-10"><img src="logo.png" class="h-20"></div>
                <h2 class="pink-accent text-sm font-bold mb-6 uppercase">Dashboard Administrativo:</h2>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
            <div class="bg-pink-card p-4 rounded-2xl"><p class="text-gray-800 text-xs font-bold mb-2 uppercase">Funcionários:</p><div class="bg-pink-input rounded-full px-4 py-1 text-gray-900 text-lg font-bold text-center" id="stat-funcionarios">...</div></div>
            <div class="bg-pink-card p-4 rounded-2xl"><p class="text-gray-800 text-xs font-bold mb-2 uppercase">Presentes Hoje:</p><div class="bg-pink-input rounded-full px-4 py-1 text-gray-900 text-lg font-bold text-center" id="stat-presenca">...</div></div>
            <div class="bg-pink-card p-4 rounded-2xl"><p class="text-gray-800 text-xs font-bold mb-2 uppercase">Justificativas:</p><div class="bg-pink-input rounded-full px-4 py-1 text-gray-900 text-lg font-bold text-center" id="stat-justificativas">...</div></div>
            <div class="bg-pink-card p-4 rounded-2xl"><p class="text-gray-800 text-xs font-bold mb-2 uppercase">Horas Extras:</p><div class="bg-pink-input rounded-full px-4 py-1 text-gray-900 text-lg font-bold text-center" id="stat-horas">0h</div></div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-10">
            <div class="lg:col-span-2 bg-gray-50 rounded-[30px] p-8 border border-gray-100">
                <h3 class="text-gray-800 font-bold mb-6">Frequência Semanal</h3>
                <div class="flex items-end justify-between h-48 gap-2">
                    <div class="flex flex-col items-center flex-1"><div class="bg-pink-input w-full rounded-t-xl bar-grow" style="height: 70%"></div><span class="text-[10px] mt-2 font-bold text-gray-400">SEG</span></div>
                    <div class="flex flex-col items-center flex-1"><div class="bg-pink-button w-full rounded-t-xl bar-grow" style="height: 85%"></div><span class="text-[10px] mt-2 font-bold text-gray-400">TER</span></div>
                    <div class="flex flex-col items-center flex-1"><div class="bg-pink-input w-full rounded-t-xl bar-grow" style="height: 95%"></div><span class="text-[10px] mt-2 font-bold text-gray-400">QUA</span></div>
                    <div class="flex flex-col items-center flex-1"><div class="bg-pink-input w-full rounded-t-xl bar-grow" style="height: 80%"></div><span class="text-[10px] mt-2 font-bold text-gray-400">QUI</span></div>
                    <div class="flex flex-col items-center flex-1"><div class="bg-pink-input w-full rounded-t-xl bar-grow" style="height: 60%"></div><span class="text-[10px] mt-2 font-bold text-gray-400">SEX</span></div>
                </div>
            </div>
            <div class="flex flex-col gap-4">
                <h3 class="text-gray-800 font-bold mb-2">Ações Rápidas</h3>
                <button onclick="window.location.href='cadastro.html'" class="w-full bg-pink-button hover:opacity-90 text-white transition-all p-4 rounded-2xl flex items-center gap-4 font-bold text-sm shadow-sm"><div class="bg-white/20 p-2 rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2"/></svg></div>Novo Funcionário</button>
                <button onclick="HCP.gerarFolha()" class="w-full bg-pink-card hover:bg-pink-300 transition-all p-4 rounded-2xl flex items-center gap-4 text-pink-900 font-bold text-sm"><div class="bg-white p-2 rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-width="2"/></svg></div>Gerar Folha Mensal</button>
                <button onclick="HCP.verAlertas()" class="w-full bg-pink-card hover:bg-pink-300 transition-all p-4 rounded-2xl flex items-center gap-4 text-pink-900 font-bold text-sm"><div class="bg-white p-2 rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2"/></svg></div>Alertas de Atraso</button>
            </div>
        </div>
        <div class="bg-white border border-gray-50 rounded-[30px] p-6 card-shadow">
            <h3 class="text-gray-800 font-bold mb-6">Atividade Recente</h3>
            <div class="space-y-4" id="recent-activity-container">
                <p class="text-gray-400 text-sm italic">Carregando atividades...</p>
            </div>
        </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => HCP.init());</script>
</body>
</html>
