<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório - High Control Point</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../componets/layout-styles.css">
    <style>
        body { font-family: "Times New Roman", Times, serif; background-color: #ffffff; }
        .pink-accent { color: #A4133C; }
        .bg-pink-light { background-color: #FFC1CC; }
        .bg-pink-header { background-color: #FFC1CC; }
        .card-shadow { box-shadow: 0 4px 25px rgba(0,0,0,0.06); border: 1px solid #f0f0f0; }
        .table-row-border { border-bottom: 1px solid #ffffff; }
    </style>
</head>
<body>
    <main class="content p-2 md:p-10 flex justify-center items-start mt-16">
    <div class="w-full max-w-4xl bg-white rounded-[40px] card-shadow p-6 md:p-12">

        <div class="flex justify-center mb-10">
            <img src="logo.png" alt="High Control Point" class="h-20 w-auto object-contain">
        </div>

        <h2 class="pink-accent text-sm font-bold mb-10 uppercase tracking-widest text-center md:text-left">
            Seu Histórico de Pontos:
        </h2>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div>
                <label class="block text-gray-700 font-semibold mb-2 ml-1">Mês:</label>
                <div class="relative">
                    <select id="relatorio-mes" onchange="HCP.carregarRelatorios()" class="w-full appearance-none bg-pink-light border-none rounded-xl py-3 px-4 text-gray-700 focus:ring-2 focus:ring-pink-400 outline-none">
                        <option value="1">Janeiro</option>
                        <option value="2">Fevereiro</option>
                        <option value="3">Março</option>
                        <option value="4" selected>Abril</option>
                        <option value="5">Maio</option>
                        <option value="6">Junho</option>
                        <option value="7">Julho</option>
                        <option value="8">Agosto</option>
                        <option value="9">Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11">Novembro</option>
                        <option value="12">Dezembro</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-700">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-2 ml-1">Ano:</label>
                <div class="relative">
                    <select id="relatorio-ano" onchange="HCP.carregarRelatorios()" class="w-full appearance-none bg-pink-light border-none rounded-xl py-3 px-4 text-gray-700 focus:ring-2 focus:ring-pink-400 outline-none">
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026" selected>2026</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-700">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-pink-light rounded-2xl overflow-hidden mb-6">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-pink-800 font-bold border-b border-white">
                            <th class="p-3 md:p-4 border-r border-white w-1/3 text-sm">Dia:</th>
                            <th class="p-3 md:p-4 text-sm">Registros:</th>
                        </tr>
                    </thead>
                    <tbody id="relatorio-table-body" class="text-[10px] md:text-sm text-pink-900">
                        <tr>
                            <td colspan="2" class="p-10 text-center italic">Carregando seus registros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="flex justify-end gap-6 pr-2 no-print">
            <button onclick="HCP.baixarRelatorioPDF()" class="pink-accent hover:opacity-70 transition-opacity">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
            </button>
        </div>
    </div>
    </main>

    <script src="app.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => HCP.init());</script>
</body>
</html>
